services:
  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 5001
    ports:
      - "5001:5001"

  order-service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 5002
      USER_SERVICE_URL: http://user-service:5001
      REQUEST_TIMEOUT_SECONDS: 2
    depends_on:
      - user-service
    ports:
      - "5002:5002"
